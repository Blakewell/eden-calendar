name: CI

# Runs on every pull request; both jobs must pass before merging to main.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx oxlint --deny-warnings
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Real-browser tests at phone size, light and dark.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  database:
    name: Database (migrations, security tests)
    runs-on: ubuntu-latest
    env:
      # config.toml reads these; the local test database doesn't need real values.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Starts a local Postgres and applies every migration from scratch.
      - run: supabase db start
      - run: supabase test db
